<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>다크모드 만들기</title>

    <script>
        window.onload = function(){

            // body 가져오기
            let body = document.body;

            // 배경색 : 검은색
            body.style.backgroundColor = "black";

            // 전체 글자색 : 흰색
            body.style.color = "white";

            // 첫 번째 h1 가져오기
            let firstH1 = document.getElementById("first_h1");

            // 원래 글자색
            firstH1.style.color = "orange";

            // 글자 배경색 : 원래 글자색의 보색
            firstH1.style.backgroundColor = "blue";

            // 글자 내용 변경
            firstH1.innerHTML = "첫 번째 h1 요소입니다.";
        }
    </script>
</head>

<body>

    <h1 id="first_h1">DOM(Document Object Model)</h1>

    <h1>
        요소객체가 로드된 이후에 요소객체의 CSS 스타일을 변경할 수 있습니다.
    </h1>

</body>
</html>

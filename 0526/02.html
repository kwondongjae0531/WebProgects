<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명함수 실행 우선순위</title>
    <script>
        let anmFUnc = function(){
            alert("1 > 익명함수입니다.");
        }

         anmFUnc = function(){
            alert("2 > 익명함수입니다.");
        }

        alert(typeof(anmFUnc)+ ":" + anmFUnc);
    </script>
</head>
<body>
    <button onclick="anmFUnc()">익명함수 호출</button>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소객체 속성 조작</title>
    <script>
        // textContent, innerHTML
        window.onload = function(){
          let img1 = document.getElementById("img1");
         
          //img1.src = "https://placehold.co/300x200";
          img1.src = "imgs/11.jpg";
          img1.width = 300;
          img1.height = 200;

           
              }

              function changeImage(btn){
                if(btn.innerText.includes("이브이")){
                  img1.src = "imgs/11.jpg";
                  btn.innerText = " 범고래로 변경";
                } else {
                img1.src = "imgs/killerwhale.png";
                btn.innerText = " 이브이로 변경";
              }
            }
    </script>
</head>
<body>
    <button onclick="changeImage(this)"> 동물이미지 변경</button>
    <br><br>
    <img id="img1">
</body>
</html>
